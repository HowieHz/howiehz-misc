name: Build Documentation
description: Setup pnpm & Node.js, install dependencies, build docs, and upload artifact

inputs:
  artifact-name:
    description: Name for the uploaded build artifact
    required: false
    default: "docs-dist"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # https://github.com/pnpm/action-setup/releases/tag/v6.1.0
      name: Install pnpm
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # https://github.com/actions/setup-node/releases/tag/v7.1.0
      with:
        node-version: 24
        cache: "pnpm"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build Documentation
      shell: bash
      run: pnpm docs:build

    - name: Upload build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: docs/.vitepress/dist
