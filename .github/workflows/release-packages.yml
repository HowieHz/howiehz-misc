name: Release Packages

on:
  push:
    branches: [main]

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
      has-release-packages: ${{ steps.release-packages.outputs.has_packages }}
      package-directories-json: ${{ steps.release-packages.outputs.package_directories_json }}
      has-release-userscripts: ${{ steps.release-packages.outputs.has_userscripts }}
      userscript-directories-json: ${{ steps.release-packages.outputs.userscript_directories_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PR_WORKFLOW_TOKEN || github.token }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # https://github.com/pnpm/action-setup/releases/tag/v6.0.10
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release pull request
        id: changesets
        uses: changesets/action@22ccf9aa43179fe9e27dc62e575971d28cce197c # https://github.com/changesets/action/releases/tag/v2.0.0
        with:
          github-token: ${{ secrets.PR_WORKFLOW_TOKEN || github.token }}
          version-script: pnpm changeset:version
          pr-title: "release: update package versions"
          commit-message: "release: update package versions"
        env:
          GITHUB_TOKEN: ${{ secrets.PR_WORKFLOW_TOKEN || github.token }}

      - name: Resolve packages to publish
        id: release-packages
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/resolve-release-packages.js

  build-packages:
    name: Build and attest release packages
    needs: prepare-release
    if: needs.prepare-release.outputs.has-release-packages == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/reusable-build-packages.yml
    with:
      artifact-name: npm-package-artifacts
      package-directories-json: ${{ needs.prepare-release.outputs.package-directories-json }}

  build-userscripts:
    name: Build userscript release assets
    needs: prepare-release
    if: needs.prepare-release.outputs.has-release-userscripts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # https://github.com/pnpm/action-setup/releases/tag/v6.0.10
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build userscript release assets
        env:
          USER_SCRIPT_DIRECTORIES_JSON: ${{ needs.prepare-release.outputs.userscript-directories-json }}
        run: |
          node --input-type=module <<'EOF'
          import { copyFile, mkdir, readFile } from "node:fs/promises";
          import path from "node:path";
          import { spawnSync } from "node:child_process";

          const packageDirectories = JSON.parse(process.env.USER_SCRIPT_DIRECTORIES_JSON ?? "[]");
          const outputDirectory = path.resolve("dist/userscript-assets");
          await mkdir(outputDirectory, { recursive: true });

          for (const directory of packageDirectories) {
            if (typeof directory !== "string" || directory.length === 0) {
              console.error(`Invalid userscript package directory: ${directory}`);
              process.exit(1);
            }

            const packageDirectory = path.resolve(directory);
            const packageJson = JSON.parse(await readFile(path.join(packageDirectory, "package.json"), "utf8"));
            const result = spawnSync("pnpm", ["--filter", packageJson.name, "build"], { stdio: "inherit" });
            if (result.status !== 0) process.exit(result.status ?? 1);

            if (typeof packageJson.releaseAsset !== "string" || path.isAbsolute(packageJson.releaseAsset)) {
              console.error(`releaseAsset must be a relative path: ${directory}`);
              process.exit(1);
            }

            const assetPath = path.resolve(packageDirectory, packageJson.releaseAsset);
            const relativeAssetPath = path.relative(packageDirectory, assetPath);
            if (relativeAssetPath.length === 0 || relativeAssetPath.startsWith("..") || path.isAbsolute(relativeAssetPath)) {
              console.error(`releaseAsset must stay inside its package: ${directory}`);
              process.exit(1);
            }

            const destinationPath = path.join(outputDirectory, path.basename(directory), path.basename(assetPath));
            await mkdir(path.dirname(destinationPath), { recursive: true });
            await copyFile(assetPath, destinationPath);
          }
          EOF

      - name: Upload userscript release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # https://github.com/actions/upload-artifact/releases/tag/v7.0.1
        with:
          name: userscript-release-assets
          path: dist/userscript-assets

  verify-attestations:
    name: Verify package attestations
    needs: [prepare-release, build-packages]
    if: needs.prepare-release.outputs.has-release-packages == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # https://github.com/actions/download-artifact/releases/tag/v8.0.1
        with:
          name: npm-package-artifacts
          path: dist/npm-packages

      - name: Verify package attestations from reusable workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/reusable-build-packages.yml
        run: |
          shopt -s nullglob
          packages=(dist/npm-packages/*.tgz)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No npm package artifacts found for attestation verification." >&2
            exit 1
          fi

          pids=()
          for package in "${packages[@]}"; do
            (
              gh attestation verify "$package" \
                --repo "${GITHUB_REPOSITORY}" \
                --signer-workflow "${SIGNER_WORKFLOW}"
            ) &
            pids+=("$!")
          done

          for pid in "${pids[@]}"; do
            wait "$pid"
          done

  publish-packages:
    name: Publish packages to npm
    needs: [prepare-release, build-packages, verify-attestations]
    if: needs.prepare-release.outputs.has-release-packages == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          sparse-checkout: |
            package.json
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # https://github.com/pnpm/action-setup/releases/tag/v6.0.10
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # https://github.com/actions/download-artifact/releases/tag/v8.0.1
        with:
          name: npm-package-artifacts
          path: dist/npm-packages

      - name: Publish package tarballs
        run: |
          shopt -s nullglob
          packages=(dist/npm-packages/*.tgz)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No npm package artifacts found for publishing." >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            npm publish "$package" --access public --provenance
          done

  create-github-releases:
    name: Create GitHub releases
    needs: [prepare-release, publish-packages, build-userscripts]
    if: |
      always() &&
      (needs.prepare-release.outputs.has-release-packages == 'true' || needs.prepare-release.outputs.has-release-userscripts == 'true') &&
      (needs.prepare-release.outputs.has-release-packages != 'true' || needs.publish-packages.result == 'success') &&
      (needs.prepare-release.outputs.has-release-userscripts != 'true' || needs.build-userscripts.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          token: ${{ secrets.PR_WORKFLOW_TOKEN || github.token }}
          sparse-checkout: |
            .github/scripts
            packages

      - name: Download userscript release assets
        if: needs.prepare-release.outputs.has-release-userscripts == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # https://github.com/actions/download-artifact/releases/tag/v8.0.1
        with:
          name: userscript-release-assets
          path: dist/userscript-assets

      - name: Create Git tags and GitHub releases
        env:
          GITHUB_TOKEN: ${{ secrets.PR_WORKFLOW_TOKEN || github.token }}
          PACKAGE_DIRECTORIES_JSON: ${{ needs.prepare-release.outputs.package-directories-json }}
          USERSCRIPT_DIRECTORIES_JSON: ${{ needs.prepare-release.outputs.userscript-directories-json }}
          RELEASE_ASSET_ROOT: dist/userscript-assets
        run: node .github/scripts/create-github-releases.js

  publish-userscript-branch:
    name: Publish stable userscripts to dist branch
    needs: [prepare-release, build-userscripts, create-github-releases]
    if: |
      always() &&
      needs.prepare-release.outputs.has-release-userscripts == 'true' &&
      needs.build-userscripts.result == 'success' &&
      needs.create-github-releases.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          token: ${{ secrets.PR_WORKFLOW_TOKEN || github.token }}

      - name: Download userscript release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # https://github.com/actions/download-artifact/releases/tag/v8.0.1
        with:
          name: userscript-release-assets
          path: dist/userscript-assets

      - name: Publish stable userscript assets
        env:
          USERSCRIPT_DIRECTORIES_JSON: ${{ needs.prepare-release.outputs.userscript-directories-json }}
        run: |
          worktree="$RUNNER_TEMP/dist-userscript"
          trap 'git worktree remove --force "$worktree"' EXIT
          git fetch origin refs/heads/dist-userscript:refs/remotes/origin/dist-userscript
          git worktree add --detach "$worktree" origin/dist-userscript

          publishedDirectoriesFile="$RUNNER_TEMP/userscript-published-directories"
          WORKTREE="$worktree" PUBLISHED_DIRECTORIES_FILE="$publishedDirectoriesFile" node --input-type=module <<'EOF'
          import { copyFile, mkdir, readFile, rm, writeFile } from "node:fs/promises";
          import path from "node:path";

          const worktree = path.resolve(process.env.WORKTREE ?? "");
          const packageDirectories = JSON.parse(process.env.USERSCRIPT_DIRECTORIES_JSON ?? "[]");

          if (!Array.isArray(packageDirectories)) {
            throw new Error("USERSCRIPT_DIRECTORIES_JSON must be an array.");
          }

          const publishedDirectories = new Set();
          for (const directory of packageDirectories) {
            if (typeof directory !== "string" || directory.length === 0) {
              throw new Error(`Invalid userscript package directory: ${directory}`);
            }

            const packageDirectory = path.resolve(directory);
            const packageJson = JSON.parse(await readFile(path.join(packageDirectory, "package.json"), "utf8"));
            if (typeof packageJson.version !== "string" || packageJson.version.includes("-")) {
              continue;
            }
            if (typeof packageJson.releaseAsset !== "string" || path.isAbsolute(packageJson.releaseAsset)) {
              throw new Error(`releaseAsset must be a relative path: ${directory}`);
            }

            const assetPath = path.resolve(packageDirectory, packageJson.releaseAsset);
            const relativeAssetPath = path.relative(packageDirectory, assetPath);
            if (relativeAssetPath.length === 0 || relativeAssetPath.startsWith("..") || path.isAbsolute(relativeAssetPath)) {
              throw new Error(`releaseAsset must stay inside its package: ${directory}`);
            }

            if (
              typeof packageJson.name !== "string" ||
              packageJson.name.length === 0 ||
              packageJson.name !== path.basename(packageJson.name) ||
              packageJson.name === "." ||
              packageJson.name === ".."
            ) {
              throw new Error(`userscript package name must be a plain directory name: ${directory}`);
            }

            const publishedDirectory = packageJson.name;
            if (publishedDirectories.has(publishedDirectory)) {
              throw new Error(`Duplicate userscript publish directory: ${publishedDirectory}`);
            }
            publishedDirectories.add(publishedDirectory);

            const destinationDirectory = path.join(worktree, publishedDirectory);
            const artifactPath = path.resolve(
              "dist/userscript-assets",
              path.basename(directory),
              path.basename(assetPath),
            );
            await rm(destinationDirectory, { force: true, recursive: true });
            await mkdir(destinationDirectory, { recursive: true });
            await copyFile(artifactPath, path.join(destinationDirectory, path.basename(assetPath)));
          }

          await writeFile(process.env.PUBLISHED_DIRECTORIES_FILE, [...publishedDirectories].join("\n"), "utf8");
          EOF
          mapfile -t packageDirectories < "$publishedDirectoriesFile"

          if [ "${#packageDirectories[@]}" -eq 0 ]; then
            echo "No stable userscript assets to publish."
            exit 0
          fi

          git -C "$worktree" add --all -- "${packageDirectories[@]}"
          if git -C "$worktree" diff --cached --quiet; then
            echo "Userscript branch is already current."
            exit 0
          fi

          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" commit -m "release: publish userscripts"
          git -C "$worktree" push origin HEAD:dist-userscript
